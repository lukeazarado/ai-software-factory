<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minhas tarefas</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#182334;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:clamp(20px,5vw,64px) 16px}.app{max-width:680px;margin:auto;background:#fff;border:1px solid #e4eaf1;border-radius:20px;padding:clamp(20px,5vw,40px);box-shadow:0 16px 48px #17243b12}h1{margin:0 0 8px;font-size:clamp(1.7rem,5vw,2.3rem)}.intro{margin:0 0 28px;color:#5b6878}form{display:flex;gap:10px;flex-wrap:wrap}label{display:block;font-weight:650;margin-bottom:9px}.field{flex:1 1 230px}input[type=text]{width:100%;min-height:46px;border:1px solid #aab7c8;border-radius:10px;padding:10px 13px;font:inherit}button{min-height:44px;border-radius:10px;border:1px solid transparent;padding:10px 16px;font:inherit;font-weight:650;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #8ac4ff;outline-offset:3px}.primary{align-self:flex-end;background:#1459bf;color:white}.primary:hover{background:#0c469c}.summary{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:30px;padding-bottom:12px;border-bottom:1px solid #e8edf3}.summary h2{font-size:1.1rem;margin:0}.count{font-size:.9rem;color:#536478}.empty{padding:28px 8px;text-align:center;color:#687687}ul{list-style:none;padding:0;margin:0}.task{display:flex;gap:12px;align-items:center;padding:15px 0;border-bottom:1px solid #edf1f5}.task:last-child{border-bottom:0}.task input{width:20px;height:20px;flex-shrink:0;accent-color:#1459bf;cursor:pointer}.task label{margin:0;flex:1;min-width:0;overflow-wrap:anywhere;font-weight:450;cursor:pointer}.task.done label{text-decoration:line-through;color:#718094}.delete{background:#fff;color:#9b2536;border-color:#e6b5be}.delete:hover{background:#fff1f3}.error{color:#b42336;min-height:1.5em;margin:8px 0 0;font-size:.92rem}@media(max-width:420px){.primary{width:100%}.task{gap:9px}.delete{padding:9px 11px}}
</style>
</head>
<body>
<main class="app">
<h1>Minhas tarefas</h1>
<p class="intro">Organize o que precisa fazer, uma tarefa de cada vez.</p>
<form id="task-form" novalidate>
<div class="field"><label for="task-input">Nova tarefa</label><input id="task-input" type="text" maxlength="200" autocomplete="off" placeholder="Ex.: Revisar o projeto" aria-describedby="task-error" required></div>
<button class="primary" type="submit">Adicionar tarefa</button>
</form>
<p id="task-error" class="error" role="alert" aria-live="polite"></p>
<section aria-labelledby="task-heading">
<div class="summary"><h2 id="task-heading">Lista de tarefas</h2><span class="count" id="task-count" aria-live="polite">0 pendentes de 0</span></div>
<p id="empty-state" class="empty">Nenhuma tarefa ainda. Adicione a primeira!</p>
<ul id="task-list" aria-label="Tarefas cadastradas"></ul>
</section>
</main>
<script>
(() => {
'use strict';
const form=document.getElementById('task-form');
const input=document.getElementById('task-input');
const error=document.getElementById('task-error');
const list=document.getElementById('task-list');
const count=document.getElementById('task-count');
const empty=document.getElementById('empty-state');
let nextId=0;
const tasks=[];
function render(){
list.replaceChildren();
for(const task of tasks){
const item=document.createElement('li');
item.className='task'+(task.done?' done':'');
const checkbox=document.createElement('input');
checkbox.type='checkbox';
checkbox.id='task-'+task.id;
checkbox.checked=task.done;
checkbox.setAttribute('aria-label',(task.done?'Reabrir tarefa: ':'Concluir tarefa: ')+task.text);
checkbox.addEventListener('change',()=>{task.done=checkbox.checked;render();});
const label=document.createElement('label');
label.htmlFor=checkbox.id;
label.textContent=task.text;
const remove=document.createElement('button');
remove.type='button';
remove.className='delete';
remove.textContent='Excluir';
remove.setAttribute('aria-label','Excluir tarefa: '+task.text);
remove.addEventListener('click',()=>{
const index=tasks.findIndex(entry=>entry.id===task.id);
if(index!==-1)tasks.splice(index,1);
render();
input.focus();
});
item.append(checkbox,label,remove);
list.append(item);
}
const remaining=tasks.filter(task=>!task.done).length;
count.textContent=remaining+' '+(remaining===1?'pendente':'pendentes')+' de '+tasks.length;
empty.hidden=tasks.length>0;
}
form.addEventListener('submit',event=>{
event.preventDefault();
const text=input.value.trim();
if(!text){
error.textContent='Digite uma tarefa antes de adicionar.';
input.setAttribute('aria-invalid','true');
input.focus();
return;
}
error.textContent='';
input.removeAttribute('aria-invalid');
tasks.push({id:++nextId,text,done:false});
input.value='';
render();
input.focus();
});
input.addEventListener('input',()=>{error.textContent='';input.removeAttribute('aria-invalid');});
render();
})();
</script>
</body>
</html>
