<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minhas tarefas</title>
<style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#263d33;background:#f1f7ef;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:clamp(22px,6vw,72px) 16px;line-height:1.5;background:radial-gradient(circle at 8% 0%,#dcefdc 0,transparent 35%),radial-gradient(circle at 90% 95%,#e2f2e7 0,transparent 40%),#f4f8f2}.app{max-width:730px;margin:auto;background:#fffdfb;border:1px solid #dce9dd;border-radius:26px;padding:clamp(22px,5vw,44px);box-shadow:0 22px 65px #385a3b14}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:#3d7055;background:#eaf5e9;border:1px solid #d3e9d6;border-radius:999px;padding:6px 13px;font-size:.78rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase}.eyebrow::before{content:"";width:8px;height:8px;background:#7fb79a;border-radius:50%}h1{font-size:clamp(2rem,5vw,2.8rem);letter-spacing:-.045em;line-height:1.15;margin:18px 0 10px}.intro{color:#617567;margin:0 0 30px;max-width:50ch}form{background:#f5f9f3;border:1px solid #e3ede0;border-radius:18px;padding:18px;display:flex;gap:12px;flex-wrap:wrap}label{display:block;font-weight:700;margin-bottom:8px;color:#375643}.field{flex:1 1 230px}input[type=text]{width:100%;min-height:48px;border:1px solid #b9cfbd;background:white;border-radius:12px;padding:11px 14px;font:inherit;color:#263d33}input[type=text]::placeholder{color:#738579}input[type=text]:hover{border-color:#729e7f}input[aria-invalid=true]{border-color:#ad4551}button{min-height:46px;border-radius:12px;border:1px solid transparent;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #5e9e7b;outline-offset:3px}.primary{align-self:flex-end;background:#477b5e;color:#fff;box-shadow:0 5px 12px #477b5e24}.primary:hover{background:#356749}.summary{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:32px;padding-bottom:15px;border-bottom:1px solid #e2ebe1}.summary h2{font-size:1.14rem;margin:0;letter-spacing:-.02em}.count{font-size:.82rem;color:#477b5e;background:#eaf5e9;border-radius:999px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums}.empty{padding:38px 10px;text-align:center;color:#6d7e72;background:#f9fbf8;border-radius:14px;margin-top:16px}.empty[hidden]{display:none}ul{list-style:none;padding:0;margin:12px 0 0}.task{display:flex;gap:14px;align-items:center;min-height:70px;padding:14px 12px;border-bottom:1px solid #eaf0e9;border-radius:12px}.task:last-child{border-bottom:0}.task:focus-within{background:#f0f7ef}.task.done{background:#f8faf7}.task input{width:21px;height:21px;flex-shrink:0;accent-color:#477b5e;cursor:pointer}.task label{margin:0;flex:1;min-width:0;overflow-wrap:anywhere;font-weight:550;color:#304b3b;cursor:pointer}.task.done label{text-decoration:line-through;color:#7a8b7e}.delete{background:#fff;color:#934a4d;border-color:#e8c9c9;min-height:42px}.delete:hover{background:#fff4f2}.delete:focus-visible{outline-color:#934a4d}.error{color:#9c303d;min-height:1.3em;margin:8px 0 0;font-size:.91rem}.status{margin:8px 0 0;color:#396a4e;min-height:1.3em;font-size:.91rem}@media(max-width:460px){.app{border-radius:20px}form{padding:14px}.primary{width:100%}.task{gap:10px;padding:12px 4px}.delete{padding:9px 11px}.count{white-space:nowrap}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<span class="eyebrow">Seu espaço de organização</span>
<h1>Minhas tarefas</h1>
<p class="intro">Um dia mais leve começa com pequenas conquistas. Organize suas prioridades aqui.</p>
<form id="task-form" novalidate>
<div class="field"><label for="task-input">Nova tarefa</label><input id="task-input" type="text" maxlength="200" autocomplete="off" placeholder="Ex.: Revisar o projeto" aria-describedby="task-error" required></div>
<button class="primary" type="submit">Adicionar tarefa</button>
</form>
<p id="task-error" class="error" role="alert"></p>
<p id="task-status" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
<section aria-labelledby="task-heading">
<div class="summary"><h2 id="task-heading">Lista de tarefas</h2><span class="count" id="task-count" aria-live="polite">0 pendentes de 0</span></div>
<p id="empty-state" class="empty">Nenhuma tarefa ainda. Adicione a primeira!</p>
<ul id="task-list" aria-label="Tarefas cadastradas"></ul>
</section>
</main>
<script>
(() => {
'use strict';
const form=document.getElementById('task-form');
const input=document.getElementById('task-input');
const error=document.getElementById('task-error');
const list=document.getElementById('task-list');
const count=document.getElementById('task-count');
const empty=document.getElementById('empty-state');
const status=document.getElementById('task-status');
let nextId=0;
const tasks=[];
function render(focusId=null){
list.replaceChildren();
for(const task of tasks){
const item=document.createElement('li');
item.className='task'+(task.done?' done':'');
const checkbox=document.createElement('input');
checkbox.type='checkbox';
checkbox.id='task-'+task.id;
checkbox.checked=task.done;
checkbox.setAttribute('aria-label',(task.done?'Reabrir tarefa: ':'Concluir tarefa: ')+task.text);
checkbox.addEventListener('change',()=>{task.done=checkbox.checked;status.textContent=task.done?'Tarefa concluída: '+task.text:'Tarefa reaberta: '+task.text;render(task.id);});
const label=document.createElement('label');
label.htmlFor=checkbox.id;
label.textContent=task.text;
const remove=document.createElement('button');
remove.type='button';
remove.className='delete';
remove.textContent='Excluir';
remove.setAttribute('aria-label','Excluir tarefa: '+task.text);
remove.addEventListener('click',()=>{
const index=tasks.findIndex(entry=>entry.id===task.id);
if(index!==-1)tasks.splice(index,1);
status.textContent='Tarefa excluída: '+task.text;
const next=tasks[Math.min(index,tasks.length-1)];
render(next?next.id:null);
if(!next)input.focus();
});
item.append(checkbox,label,remove);
list.append(item);
}
const remaining=tasks.filter(task=>!task.done).length;
count.textContent=remaining+' '+(remaining===1?'pendente':'pendentes')+' de '+tasks.length;
empty.hidden=tasks.length>0;
if(focusId!==null){const target=document.getElementById('task-'+focusId);if(target)target.focus();}
}
form.addEventListener('submit',event=>{
event.preventDefault();
const text=input.value.trim();
if(!text){
error.textContent='Digite uma tarefa antes de adicionar.';
status.textContent='';
input.setAttribute('aria-invalid','true');
input.focus();
return;
}
error.textContent='';
input.removeAttribute('aria-invalid');
tasks.push({id:++nextId,text,done:false});
status.textContent='Tarefa adicionada: '+text;
input.value='';
render();
input.focus();
});
input.addEventListener('input',()=>{error.textContent='';input.removeAttribute('aria-invalid');});
render();
})();
</script>
</body>
</html>
