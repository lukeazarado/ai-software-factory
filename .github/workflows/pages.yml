name: Publicar template web no GitHub Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefato estatico
        uses: actions/upload-pages-artifact@v3
        with:
          path: template-web
      - name: Publicar pagina
        id: deployment
        uses: actions/deploy-pages@v4
