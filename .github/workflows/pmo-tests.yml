name: PMO Consignado — testes

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/pmo-consignado/**'
      - '.github/workflows/pmo-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe
        run: |
          node --experimental-default-type=module --check apps/pmo-consignado/dist/core.js
          node --experimental-default-type=module --check apps/pmo-consignado/dist/app.js
      - name: Testar regras de PMO
        run: node --test apps/pmo-consignado/tests/*.test.mjs
