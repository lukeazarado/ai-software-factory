name: Testar Agenda do Atleta (CI e manual)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: |
          python -m pip install -r apps/agenda_atleta/requirements.txt
          python -m pip install 'pytest>=8'
      - name: Verificar sintaxe Python
        run: python -m compileall -q apps/agenda_atleta factory
      - name: Verificar sintaxe de todas as telas JavaScript
        run: |
          node --check apps/agenda_atleta/web/app.js
          node --check apps/agenda_atleta/web/account.js
          node --check apps/agenda_atleta/web/admin.js
      - name: Executar suíte automatizada
        run: python -m pytest -q