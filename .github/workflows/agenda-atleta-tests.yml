name: Testar Agenda do Atleta (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: |
          python -m pip install -r apps/agenda_atleta/requirements.txt
          python -m pip install 'pytest>=8'
      - name: Verificar sintaxe Python
        run: python -m compileall -q apps/agenda_atleta
      - name: Executar suíte automatizada
        run: python -m pytest -q
